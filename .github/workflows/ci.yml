name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Translate grammar to JSON
        run: npm run prebuild

      - name: Archive tmGrammar files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmGrammar.json
          path: syntaxes/*.tmGrammar.json

      - name: Build Package
        if: always()
        run: npm run build

      - name: Archive vsix package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metamodelica.vsix
          path: metamodelica-*.vsix

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Download tmGrammar files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tmGrammar.json
          path: syntaxes

      - name: Run Test
        run: npm run test

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metamodelica.vsix

      - name: Release
        if: always()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            metamodelica-*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true

      - name: Publish to Visual Studio Marketplace
        if: always()
        run: |
          npx vsce publish -i $(ls metamodelica-*.vsix) -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: always()
        run: |
          npx ovsx publish $(ls metamodelica-*.vsix) -p ${{ secrets.OPEN_VSX_TOKEN }}
